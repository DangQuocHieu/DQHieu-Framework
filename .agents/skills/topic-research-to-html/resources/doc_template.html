<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <style>
        :root[data-theme="dark"] {
            --bg-body: #0a0e17;
            --bg-sidebar: #0f1523;
            --bg-card: #151c2e;
            --bg-card-hover: #1b243b;
            --bg-code: #0b0f19;
            --border-color: #222f49;
            --border-accent: #38bdf8;
            --border-danger: #f43f5e;
            --border-success: #10b981;
            --border-warning: #f59e0b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --accent-purple: #a855f7;
            --tag-bg: rgba(56, 189, 248, 0.12);
            --danger-bg: rgba(244, 63, 94, 0.1);
            --danger-text: #fb7185;
            --success-bg: rgba(16, 185, 129, 0.1);
            --success-text: #34d399;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --warning-text: #fbbf24;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        :root[data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --bg-code: #0f172a;
            --border-color: #e2e8f0;
            --border-accent: #0284c7;
            --border-danger: #e11d48;
            --border-success: #059669;
            --border-warning: #d97706;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-dim: #94a3b8;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --accent-purple: #9333ea;
            --tag-bg: rgba(2, 132, 199, 0.1);
            --danger-bg: rgba(225, 29, 72, 0.08);
            --danger-text: #be123c;
            --success-bg: rgba(5, 150, 105, 0.08);
            --success-text: #047857;
            --warning-bg: rgba(217, 119, 6, 0.08);
            --warning-text: #b45309;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 15px;
        }

        /* SIDEBAR NAVIGATION */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent);
            background: var(--tag-bg);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border-accent);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .nav-list {
            list-style: none;
            padding: 16px 12px;
            flex: 1;
        }

        .nav-item {
            margin-bottom: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--text-main);
            background: var(--bg-card);
        }

        .nav-link.active {
            color: var(--accent);
            background: var(--tag-bg);
            font-weight: 600;
            border-left: 3px solid var(--accent);
        }

        .nav-sub {
            list-style: none;
            padding-left: 18px;
            margin-top: 2px;
        }

        .nav-sub .nav-link {
            font-size: 12.5px;
            padding: 6px 10px;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .theme-toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 320px;
            flex: 1;
            padding: 40px 60px 80px;
            max-width: 1140px;
        }

        /* HERO HEADER */
        .hero-banner {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.08) 0%, rgba(168, 85, 247, 0.08) 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 40px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent), var(--accent-purple));
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .meta-pill {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .pill-senior {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .pill-time {
            background: var(--tag-bg);
            color: var(--accent);
            border: 1px solid var(--border-accent);
        }

        .pill-level {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        h1.hero-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.25;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #f1f5f9 0%, #38bdf8 60%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        :root[data-theme="light"] h1.hero-title {
            background: linear-gradient(90deg, #0f172a 0%, #0284c7 60%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 820px;
            line-height: 1.6;
        }

        /* SECTIONS */
        .doc-section {
            margin-bottom: 56px;
            scroll-margin-top: 24px;
        }

        .section-header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .section-header h2 {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
        }

        .section-header .section-tag {
            font-size: 13px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            background: var(--tag-bg);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .section-lead {
            font-size: 15.5px;
            color: var(--text-muted);
            margin-top: 8px;
            line-height: 1.7;
        }

        h3 {
            font-size: 18px;
            font-weight: 700;
            margin: 28px 0 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            scroll-margin-top: 20px;
        }

        h4 {
            font-size: 15px;
            font-weight: 700;
            margin: 18px 0 8px;
            color: var(--accent);
        }

        p {
            margin-bottom: 14px;
            color: var(--text-main);
        }

        strong {
            color: var(--text-main);
            font-weight: 700;
        }

        code.inline-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* SENIOR CALLOUT BOX */
        .callout {
            border-radius: 12px;
            padding: 18px 22px;
            margin: 20px 0;
            display: flex;
            gap: 16px;
            border-left: 4px solid;
            background: var(--bg-card);
        }

        .callout-senior {
            border-left-color: var(--accent-purple);
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.08) 0%, rgba(56, 189, 248, 0.05) 100%);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-left: 4px solid var(--accent-purple);
        }

        .callout-warning {
            border-left-color: var(--border-danger);
            background: var(--danger-bg);
            border: 1px solid rgba(244, 63, 94, 0.25);
            border-left: 4px solid var(--border-danger);
        }

        .callout-tip {
            border-left-color: var(--border-success);
            background: var(--success-bg);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-left: 4px solid var(--border-success);
        }

        .callout-info {
            border-left-color: var(--border-accent);
            background: var(--tag-bg);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-left: 4px solid var(--border-accent);
        }

        .callout-icon {
            font-size: 24px;
            line-height: 1;
            flex-shrink: 0;
        }

        .callout-content {
            flex: 1;
        }

        .callout-title {
            font-weight: 700;
            font-size: 14.5px;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .callout-text {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 0;
            line-height: 1.6;
        }

        /* GRID CARDS */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin: 20px 0;
        }

        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .info-card:hover {
            border-color: var(--border-accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-card);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-blue { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
        .icon-purple { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); }
        .icon-red { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
        .icon-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .icon-yellow { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .card-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-main);
        }

        .card-body {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* SVG DIAGRAMS */
        .diagram-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            margin: 24px 0;
            text-align: center;
            overflow-x: auto;
        }

        .diagram-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .diagram-svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* CODE BOX */
        .code-block-wrapper {
            background: var(--bg-code);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin: 20px 0;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .code-block-header {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .code-label {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .label-danger { color: var(--danger-text); }
        .label-success { color: var(--success-text); }
        .label-info { color: var(--accent); }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .copy-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        pre {
            margin: 0;
            padding: 16px !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 13px !important;
            line-height: 1.6 !important;
            overflow-x: auto;
        }

        /* COMPARISON TABLE */
        .comparison-table-wrapper {
            overflow-x: auto;
            margin: 24px 0;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        table.comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            text-align: left;
        }

        table.comparison-table th {
            background: var(--bg-card);
            padding: 14px 18px;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
        }

        table.comparison-table td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            vertical-align: top;
        }

        table.comparison-table tr:last-child td { border-bottom: none; }
        table.comparison-table tr:hover td { background: var(--bg-card-hover); }

        /* CHECKLIST */
        .checklist {
            list-style: none;
            margin: 16px 0;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
        }

        .check-icon {
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 24px 20px 60px; }
            .mobile-menu-btn { display: block; }
            .grid-2 { grid-template-columns: 1fr; }
        }

        .mobile-menu-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 200;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: none;
        }

        @media (max-width: 1024px) {
            .mobile-menu-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- MOBILE TOGGLE BUTTON -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Menu">☰</button>

    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-badge">{{HERO_BADGE}}</div>
            <div class="sidebar-title">{{SIDEBAR_TITLE}}</div>
            <div class="sidebar-subtitle">{{SIDEBAR_SUBTITLE}}</div>
        </div>

        <ul class="nav-list">
            {{SIDEBAR_TOC}}
        </ul>

        <div class="sidebar-footer">
            <button class="theme-toggle-btn" id="themeToggleBtn">
                <span id="themeIcon">☀️</span> Chế độ Sáng/Tối
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- HERO BANNER -->
        <header class="hero-banner" id="intro">
            <div class="hero-meta">
                {{HERO_META}}
            </div>
            <h1 class="hero-title">{{HERO_TITLE}}</h1>
            <p class="hero-desc">{{HERO_DESC}}</p>
        </header>

        <!-- MAIN BODY CONTENT -->
        {{MAIN_CONTENT}}

    </main>

    <!-- HIGHLIGHT.JS SCRIPT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/csharp.min.js"></script>
    <script>
        // Init Syntax Highlighting
        hljs.highlightAll();

        // Theme Toggle Logic
        const themeBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        themeBtn.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // Copy Code Functionality
        function copyCode(btn) {
            const pre = btn.closest('.code-block-wrapper').querySelector('pre code');
            navigator.clipboard.writeText(pre.innerText).then(() => {
                const originalText = btn.innerText;
                btn.innerText = 'Đã chép! ✓';
                btn.style.color = '#34d399';
                btn.style.borderColor = '#10b981';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }, 2000);
            });
        }

        // Mobile Menu Toggle
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.getElementById('sidebar');

        mobileBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // Active Link Highlighting on Scroll
        const sections = document.querySelectorAll('.doc-section, #intro');
        const navLinks = document.querySelectorAll('.sidebar .nav-link');

        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (pageYOffset >= sectionTop - 100) {
                    current = section.getAttribute('id');
                }
            });

            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === `#${current}`) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
